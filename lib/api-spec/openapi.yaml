openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: detection
    description: Call transcription and spam detection
  - name: analytics
    description: Model evaluation and dashboard analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /transcribe:
    post:
      operationId: transcribeAudio
      tags: [detection]
      summary: Transcribe a call recording
      description: Transcribes audio with the configured speech-to-text model. When Whisper is not installed, the response identifies demo mode rather than implying a production transcript.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/TranscriptionInput"
      responses:
        "200":
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResult"
        "400":
          description: Invalid audio upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /predict:
    post:
      operationId: predictCall
      tags: [detection]
      summary: Predict whether call text is spam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionInput"
      responses:
        "200":
          description: Spam classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResult"
        "400":
          description: Invalid prediction input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /metrics:
    get:
      operationId: getMetrics
      tags: [analytics]
      summary: Get model comparison metrics
      responses:
        "200":
          description: Model evaluation metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [analytics]
      summary: Get the detector dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    TranscriptionInput:
      type: object
      properties:
        audio:
          type: string
          format: binary
        model:
          type: string
          enum: [tiny, base, small, medium]
      required: [audio]
    TranscriptSegment:
      type: object
      properties:
        id:
          type: integer
        start:
          type: number
        end:
          type: number
        text:
          type: string
        confidence:
          type: number
      required: [id, start, end, text, confidence]
    TranscriptionResult:
      type: object
      properties:
        transcript:
          type: string
        language:
          type: string
        durationSeconds:
          type: number
        model:
          type: string
        mode:
          type: string
          enum: [whisper, demo]
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
      required: [transcript, language, durationSeconds, model, mode, segments]
    PredictionInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        durationSeconds:
          type: number
          minimum: 0
        speechRate:
          type: number
          minimum: 0
      required: [text]
    PredictionResult:
      type: object
      properties:
        label:
          type: string
          enum: [spam, not_spam]
        probability:
          type: number
        confidence:
          type: number
        model:
          type: string
        mode:
          type: string
          enum: [trained, heuristic]
        signals:
          type: array
          items:
            type: string
        features:
          type: object
          additionalProperties:
            type: number
        modelResults:
          type: array
          description: Prediction from every trained model, with benchmark metrics from the labeled dataset
          items:
            $ref: "#/components/schemas/ModelPrediction"
      required: [label, probability, confidence, model, mode, signals, features]
    ModelPrediction:
      type: object
      properties:
        model:
          type: string
        label:
          type: string
          enum: [spam, not_spam]
        probability:
          type: number
        accuracy:
          type: number
        precision:
          type: number
        recall:
          type: number
        f1:
          type: number
        selectionScore:
          type: number
        selectionRank:
          type: integer
      required: [model, label, probability, accuracy, precision, recall, f1, selectionScore, selectionRank]
    ModelMetric:
      type: object
      properties:
        model:
          type: string
        family:
          type: string
        accuracy:
          type: number
        precisionMacro:
          type: number
        recallMacro:
          type: number
        f1Macro:
          type: number
        precisionWeighted:
          type: number
        recallWeighted:
          type: number
        f1Weighted:
          type: number
        rocAuc:
          type: number
        prAuc:
          type: number
        logLoss:
          type: number
        trainingTimeMs:
          type: number
        inferenceLatencyMs:
          type: number
        selectionScore:
          type: number
          description: Composite score used to rank all evaluated models for deployment
        selectionRank:
          type: integer
          description: Rank produced by the metric-led model selection
        confusionMatrix:
          type: array
          items:
            type: array
            items:
              type: integer
      required: [model, family, accuracy, precisionMacro, recallMacro, f1Macro, precisionWeighted, recallWeighted, f1Weighted, rocAuc, prAuc, logLoss, trainingTimeMs, inferenceLatencyMs, confusionMatrix]
    MetricsResponse:
      type: object
      properties:
        dataset:
          type: string
        featureSet:
          type: string
        split:
          type: string
        trainedAt:
          type: string
        recommendedModel:
          type: string
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/ModelMetric"
      required: [dataset, featureSet, split, trainedAt, recommendedModel, metrics]
    DashboardSummary:
      type: object
      properties:
        callsAnalyzed:
          type: integer
        spamRate:
          type: number
        avgConfidence:
          type: number
        avgLatencyMs:
          type: number
        modelStatus:
          type: string
        topSignal:
          type: string
      required: [callsAnalyzed, spamRate, avgConfidence, avgLatencyMs, modelStatus, topSignal]

