kind = "web"
previewPath = "/"
title = "CallShield"
description = "A full-stack ML workspace for transcribing call recordings, detecting spam patterns, and comparing classification models with transparent confidence and latency metrics."
version = "1.0.0"
id = "artifacts/spam-call-detector"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19911

[services.development]
run = "pnpm --filter @workspace/spam-call-detector run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spam-call-detector", "run", "build" ]
serve = "static"
publicDir = "artifacts/spam-call-detector/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19911"
BASE_PATH = "/"
