<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CallShield - Analyst Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23c4f122%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z%22/><path d=%22m9 12 2 2 4-4%22/></svg>">
</head>
<body class="auth-page-body">
  <div class="auth-ambient-glow auth-glow-1"></div>
  <div class="auth-ambient-glow auth-glow-2"></div>
  <div class="auth-grid-overlay"></div>

  <div class="auth-container">
    <!-- Back to Sign In Link -->
    <div style="margin-bottom: 14px; text-align: left;">
      <a href="/login" class="auth-back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width: 14px; height: 14px;">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Back to Sign In</span>
      </a>
    </div>

    <!-- Main Auth Card -->
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand-logo">
          <svg class="auth-shield-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 12 2 2 4-4"/>
          </svg>
        </div>
        <h1 class="auth-title">Create Station Account</h1>
        <p class="auth-subtitle">Register new analyst credentials (persisted permanently)</p>
      </div>

      {% if error %}
      <div class="alert-box error" role="alert" style="margin-bottom: 20px;">
        <svg class="alert-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <div>{{ error }}</div>
      </div>
      {% endif %}

      {% if message %}
      <div class="alert-box info" role="status" style="margin-bottom: 20px;">
        <svg class="alert-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
        </svg>
        <div>{{ message }}</div>
      </div>
      {% endif %}

      <form method="POST" action="/register" class="auth-form" id="register-form">
        <!-- Username -->
        <div class="form-group">
          <label for="username" class="form-label">Desired Username</label>
          <div class="input-with-icon">
            <svg class="input-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-input mono" 
              placeholder="e.g. sushmita or analyst_1" 
              required 
              autocomplete="username"
              autofocus
            >
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-with-icon">
            <svg class="input-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input mono" 
              placeholder="Minimum 4 characters" 
              required 
              autocomplete="new-password"
              style="padding-right: 44px;"
            >
            <button 
              type="button" 
              class="btn-toggle-password" 
              onclick="togglePasswordVisibility('password', this)" 
              title="Toggle Password Visibility"
              aria-label="Toggle password visibility" 
              tabindex="-1"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px;">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirm_password" class="form-label">Confirm Password</label>
          <div class="input-with-icon">
            <svg class="input-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m9 12 2 2 4-4"/><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input 
              type="password" 
              id="confirm_password" 
              name="confirm_password" 
              class="form-input mono" 
              placeholder="Re-enter your password" 
              required 
              autocomplete="new-password"
              style="padding-right: 44px;"
            >
            <button 
              type="button" 
              class="btn-toggle-password" 
              onclick="togglePasswordVisibility('confirm_password', this)" 
              title="Toggle Password Visibility" 
              aria-label="Toggle password visibility"
              tabindex="-1"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px;">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div style="display: flex; align-items: center; margin-top: -2px;">
          <label class="remember-checkbox-label">
            <input type="checkbox" name="remember" id="rememberMe" checked class="custom-checkbox">
            <span>Keep session active on this workstation</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-auth-submit" id="register-btn">
          <span class="btn-spinner hidden" id="register-spinner"></span>
          <span id="register-btn-text">Register & Enter Workspace</span>
          <svg class="btn-arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

        <div class="auth-footer-text">
          <span>Already have an account?</span>
          <a href="/login" class="auth-accent-link">Sign In Instead</a>
        </div>
      </form>
    </div>

    <!-- Security Disclaimers Strip -->
    <div class="auth-trust-strip">
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Persistent Account Storage</span>
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Encrypted Workstation Session</span>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(fieldId, btn) {
      const field = document.getElementById(fieldId);
      if (!field) return;

      const eyeIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
      const eyeOffIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 17px; height: 17px;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`;

      if (field.type === 'password') {
        field.type = 'text';
        btn.innerHTML = eyeOffIcon;
        btn.setAttribute('title', 'Hide Password');
      } else {
        field.type = 'password';
        btn.innerHTML = eyeIcon;
        btn.setAttribute('title', 'Show Password');
      }
    }

    const regForm = document.getElementById('register-form');
    const regBtn = document.getElementById('register-btn');
    const regSpinner = document.getElementById('register-spinner');
    const regBtnText = document.getElementById('register-btn-text');

    if (regForm) {
      regForm.addEventListener('submit', function() {
        if (regBtn && regSpinner && regBtnText) {
          regSpinner.classList.remove('hidden');
          regBtnText.textContent = 'Registering Analyst...';
          regBtn.style.opacity = '0.85';
          regBtn.style.pointerEvents = 'none';
        }
      });
    }
  </script>
</body>
</html>
